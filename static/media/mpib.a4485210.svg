<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="MPIB — Medical Prompt Injection Benchmark">
  <defs>
    <linearGradient id="mpib-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e8eef6"/>
    </linearGradient>
    <pattern id="mpib-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#mpib-bg)"/>
  <rect width="640" height="400" fill="url(#mpib-grid)"/>

  <!-- pipeline motif: clinical prompt -> injected payload -> guarded LLM -->
  <g transform="translate(60 232)">
    <rect x="0" y="0" width="132" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="66" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">clinical</text>
    <text x="66" y="43" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">prompt</text>

    <path d="M140 30H182" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <path d="M176 25l7 5-7 5z" fill="#94a3b8"/>

    <rect x="190" y="0" width="132" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="256" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">injected</text>
    <text x="256" y="43" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c">payload</text>

    <path d="M330 30H372" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <path d="M366 25l7 5-7 5z" fill="#94a3b8"/>

    <rect x="380" y="0" width="140" height="60" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="450" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">LLM under</text>
    <text x="450" y="43" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8">safety audit</text>
  </g>

  <text x="60" y="132" font-family="Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#0f172a" letter-spacing="2">MPIB</text>
  <text x="60" y="168" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#475569">Medical Prompt Injection Benchmark</text>
  <text x="60" y="194" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Attack surface &amp; clinical safety evaluation for LLMs</text>

  <g transform="translate(60 46)">
    <rect x="0" y="0" width="196" height="26" rx="13" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="98" y="18" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Findings of EMNLP 2026</text>
  </g>
</svg>
